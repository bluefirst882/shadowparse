services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_workbench}
      MYSQL_USERNAME: ${MYSQL_USER:-video_workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      WORKBENCH_STORAGE_DIR: /app/storage
      # 默认指向 compose 内的 whisper 服务（容器化后不再依赖宿主机上手工起的 Python worker）。
      # 想改用宿主机 GPU 进程时，把 WHISPER_SERVICE_URL 覆盖成 http://host.docker.internal:8090。
      WHISPER_SERVICE_URL: ${WHISPER_SERVICE_URL:-http://whisper:8090}
      WHISPER_SERVICE_TOKEN: ${WHISPER_SERVICE_TOKEN:?请在 .env 中设置 WHISPER_SERVICE_TOKEN}
      WHISPER_MODEL: ${WHISPER_MODEL:-turbo}
      WORKBENCH_JWT_SECRET: ${WORKBENCH_JWT_SECRET:?请在 .env 中设置 WORKBENCH_JWT_SECRET}
      WORKBENCH_TOKEN_TTL_HOURS: ${WORKBENCH_TOKEN_TTL_HOURS:-24}
      WORKBENCH_PROCESS_TIMEOUT_MINUTES: ${WORKBENCH_PROCESS_TIMEOUT_MINUTES:-180}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-deepseek-v4-pro}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      # 模型单价只影响成本折算，未配置时导出成本为 null（token 用量照常统计）。
      LLM_PRICES: ${LLM_PRICES:-}
      LLM_PRICE_CURRENCY: ${LLM_PRICE_CURRENCY:-USD}
      # 容错治理（见 README「下游调用的容错治理」）：超时由 HTTP 客户端强制，并发隔板超额直接拒绝。
      WORKBENCH_LLM_TIMEOUT_SECONDS: ${WORKBENCH_LLM_TIMEOUT_SECONDS:-90}
      WORKBENCH_LLM_TRANSLATE_TIMEOUT_SECONDS: ${WORKBENCH_LLM_TRANSLATE_TIMEOUT_SECONDS:-180}
      WORKBENCH_LLM_MAX_CONCURRENT: ${WORKBENCH_LLM_MAX_CONCURRENT:-4}
      WORKBENCH_WHISPER_MAX_CONCURRENT: ${WORKBENCH_WHISPER_MAX_CONCURRENT:-1}
      # 任务队列：任务是先落库为 QUEUED 再投递消息，队列与消息都持久化，进程重启不丢任务。
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-workbench}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
      # 多实例认领：留空时用「主机名 + 随机后缀」，同一台机器上跑多个实例也能区分持有者（见 TaskLease）。
      WORKBENCH_INSTANCE_ID: ${WORKBENCH_INSTANCE_ID:-}
      WORKBENCH_LEASE_SECONDS: ${WORKBENCH_LEASE_SECONDS:-90}
      WORKBENCH_LEASE_HEARTBEAT_MILLIS: ${WORKBENCH_LEASE_HEARTBEAT_MILLIS:-20000}
      WORKBENCH_LEASE_SWEEP_MILLIS: ${WORKBENCH_LEASE_SWEEP_MILLIS:-30000}
    ports:
      - '${BACKEND_HOST_PORT:-8081}:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - video-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # 等到模型真正加载完（/health 为 ok）再起后端：否则首批任务会在启动窗口里
      # 拿到「Whisper 服务不可达」而白白消耗重试额度。
      whisper:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '${FRONTEND_HOST_PORT:-5174}:80'
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - '${PROMETHEUS_HOST_PORT:-9090}:9090'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - '${GRAFANA_HOST_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-workbench}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-workbench}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
      # 单个视频可能处理很久（转写 + 内容生成），而 RabbitMQ 默认 30 分钟收不到 ack 就会强制关闭 channel。
      # 采用「处理完再 ack」的至少一次语义，就必须把 consumer_timeout 放宽，否则长任务会被 broker 反复打断。
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit consumer_timeout 86400000'
    ports:
      - '${RABBITMQ_HOST_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_workbench}
      MYSQL_USER: ${MYSQL_USER:-video_workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD}'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  # Whisper 转写服务：容器化托管，进程死掉由 restart 策略拉起来（见 README「Whisper 容器化」）。
  whisper:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      WHISPER_SERVICE_TOKEN: ${WHISPER_SERVICE_TOKEN:?请在 .env 中设置 WHISPER_SERVICE_TOKEN}
      WHISPER_MODEL: ${WHISPER_MODEL:-turbo}
      # 模型挂载进容器；容器内不再有「模型目录」这一层配置。
      WHISPER_MODEL_DIR: /models
      WHISPER_PORT: '8090'
      WHISPER_MAX_UPLOAD_BYTES: ${WHISPER_MAX_UPLOAD_BYTES:-2147483648}
      # 转写在 worker 内串行执行（见 whisper_worker.py），CPU 线程数直接决定单次转写耗时。
      OMP_NUM_THREADS: ${WHISPER_CPU_THREADS:-4}
    volumes:
      # 复用宿主机已有模型缓存；目录为空时容器会在首次启动时把模型下载到这里（约 1.6GB）。
      - ${WHISPER_MODELS_DIR:-./models/whisper}:/models
    ports:
      - '${WHISPER_HOST_PORT:-8090}:8090'
    healthcheck:
      # /health 在模型加载完成后才可用，所以 healthy 表示「设备就绪且模型已加载」，不只是端口活着。
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8090/health']
      interval: 15s
      timeout: 5s
      retries: 20
      # 首次启动要加载 1.6GB 权重（必要时还要先下载），给足冷启动时间。
      start_period: 120s
    restart: unless-stopped

volumes:
  video-storage:
  mysql-data:
  prometheus-data:
  grafana-data:
  rabbitmq-data:
