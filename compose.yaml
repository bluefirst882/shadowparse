services:
  mysql:
    image: mysql:8.4
    container_name: video-workbench-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_workbench}
      MYSQL_USER: ${MYSQL_USERNAME:-video_workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD}'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
