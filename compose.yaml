services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_workbench}
      MYSQL_USERNAME: ${MYSQL_USER:-video_workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      WORKBENCH_STORAGE_DIR: /app/storage
      WHISPER_SERVICE_URL: ${WHISPER_SERVICE_URL:-http://host.docker.internal:8090}
      WHISPER_SERVICE_TOKEN: ${WHISPER_SERVICE_TOKEN:?请在 .env 中设置 WHISPER_SERVICE_TOKEN}
      WHISPER_MODEL: ${WHISPER_MODEL:-turbo}
      WORKBENCH_JWT_SECRET: ${WORKBENCH_JWT_SECRET:?请在 .env 中设置 WORKBENCH_JWT_SECRET}
      WORKBENCH_TOKEN_TTL_HOURS: ${WORKBENCH_TOKEN_TTL_HOURS:-24}
      WORKBENCH_PROCESS_TIMEOUT_MINUTES: ${WORKBENCH_PROCESS_TIMEOUT_MINUTES:-180}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-deepseek-v4-pro}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      # 模型单价只影响成本折算，未配置时导出成本为 null（token 用量照常统计）。
      LLM_PRICES: ${LLM_PRICES:-}
      LLM_PRICE_CURRENCY: ${LLM_PRICE_CURRENCY:-USD}
      # 容错治理（见 README「下游调用的容错治理」）：超时由 HTTP 客户端强制，并发隔板超额直接拒绝。
      WORKBENCH_LLM_TIMEOUT_SECONDS: ${WORKBENCH_LLM_TIMEOUT_SECONDS:-90}
      WORKBENCH_LLM_TRANSLATE_TIMEOUT_SECONDS: ${WORKBENCH_LLM_TRANSLATE_TIMEOUT_SECONDS:-180}
      WORKBENCH_LLM_MAX_CONCURRENT: ${WORKBENCH_LLM_MAX_CONCURRENT:-4}
      WORKBENCH_WHISPER_MAX_CONCURRENT: ${WORKBENCH_WHISPER_MAX_CONCURRENT:-1}
      # 任务队列：任务是先落库为 QUEUED 再投递消息，队列与消息都持久化，进程重启不丢任务。
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-workbench}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - video-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:80"
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-workbench}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-workbench}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
      # 单个视频可能处理很久（转写 + 内容生成），而 RabbitMQ 默认 30 分钟收不到 ack 就会强制关闭 channel。
      # 采用「处理完再 ack」的至少一次语义，就必须把 consumer_timeout 放宽，否则长任务会被 broker 反复打断。
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit consumer_timeout 86400000'
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_workbench}
      MYSQL_USER: ${MYSQL_USER:-video_workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD}'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  video-storage:
  mysql-data:
  prometheus-data:
  grafana-data:
  rabbitmq-data:
