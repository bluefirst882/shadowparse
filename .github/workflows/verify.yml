name: 验证
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: video_workbench_test
          MYSQL_USER: video_workbench
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: video_workbench_test
      MYSQL_USERNAME: video_workbench
      MYSQL_PASSWORD: test-password
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/video_workbench_test?useUnicode=true&characterEncoding=utf8
      MYSQL_TEST_USERNAME: video_workbench
      MYSQL_TEST_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: '22',
            cache: npm,
            cache-dependency-path: frontend/package-lock.json
          }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: ./mvnw -f backend/pom.xml verify
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python -m py_compile workers/whisper_worker.py
      - run: npm ci
      - run: npm run format:check
      # 每次提交都验证镜像能 build，避免 Dockerfile 悄悄坏掉才在发布时才发现。
      # whisper 是 CUDA/GPU 大镜像，本地 build 即可，CI 不构建。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 注意：backend / whisper 的 Dockerfile 里 COPY 的是仓库根目录相对路径
      # （如 COPY backend/pom.xml .），所以 context 必须是仓库根 "." 再单独指定 file；
      # frontend 的 Dockerfile 走 frontend/ 目录自身做 context（与 compose.yaml 保持一致）。
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: shadowparse-backend:ci
          cache-from: type=gha
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: shadowparse-frontend:ci
          cache-from: type=gha
