name: 验证
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: video_workbench_test
          MYSQL_USER: video_workbench
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: video_workbench_test
      MYSQL_USERNAME: video_workbench
      MYSQL_PASSWORD: test-password
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/video_workbench_test?useUnicode=true&characterEncoding=utf8
      MYSQL_TEST_USERNAME: video_workbench
      MYSQL_TEST_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: ./mvnw -f backend/pom.xml verify
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
