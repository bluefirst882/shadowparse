spring:
  config.import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20GB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20GB}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:video_workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:video_workbench}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway.enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 发布确认：broker 拒收时通过回调打点，避免「投递失败却以为入队成功」。
    publisher-confirm-type: correlated
    listener:
      simple:
        # 手动 ack：只有真正处理完（或按策略重投/进死信）才确认，进程崩溃时消息会被重新投递。
        acknowledge-mode: manual
        prefetch: ${WORKBENCH_QUEUE_PREFETCH:1}
        concurrency: 1
        max-concurrency: 1
server.error.include-message: never
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.show-details: never
  metrics:
    tags:
      application: video-workbench
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
workbench:
  storage-dir: ${WORKBENCH_STORAGE_DIR:./storage}
  max-upload-bytes: ${WORKBENCH_MAX_UPLOAD_BYTES:21474836480}
  process-timeout-minutes: ${WORKBENCH_PROCESS_TIMEOUT_MINUTES:30}
  queue:
    task-queue: ${WORKBENCH_TASK_QUEUE:workbench.tasks}
    dead-letter-queue: ${WORKBENCH_TASK_DLQ:workbench.tasks.dead}
    max-attempts: ${WORKBENCH_QUEUE_MAX_ATTEMPTS:4}
    retry-initial-delay-millis: ${WORKBENCH_QUEUE_RETRY_INITIAL_DELAY_MILLIS:5000}
    retry-multiplier: ${WORKBENCH_QUEUE_RETRY_MULTIPLIER:2}
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  security:
    jwt-secret: ${WORKBENCH_JWT_SECRET:}
    token-ttl-hours: ${WORKBENCH_TOKEN_TTL_HOURS:24}
  whisper-service-url: ${WHISPER_SERVICE_URL:http://127.0.0.1:8090}
  whisper-service-token: ${WHISPER_SERVICE_TOKEN:}
  whisper-model: ${WHISPER_MODEL:turbo}
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-v4-flash}
    fallback-model: ${LLM_FALLBACK_MODEL:deepseek-v4-pro}
    reasoning-effort: ${LLM_REASONING_EFFORT:low}
    max-input-chars: ${LLM_MAX_INPUT_CHARS:60000}
    # 模型单价（每百万 token），只用于把已入库的 usage 折算成金额：
    # 格式「模型:输入单价:输出单价」，多条用逗号分隔，不配置则只统计 token 不折算金额。
    prices: ${LLM_PRICES:}
    price-currency: ${LLM_PRICE_CURRENCY:USD}
