spring:
  config.import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20GB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20GB}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:video_workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:video_workbench}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway.enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 发布确认：broker 拒收时通过回调打点，避免「投递失败却以为入队成功」。
    publisher-confirm-type: correlated
    listener:
      simple:
        # 手动 ack：只有真正处理完（或按策略重投/进死信）才确认，进程崩溃时消息会被重新投递。
        acknowledge-mode: manual
        prefetch: ${WORKBENCH_QUEUE_PREFETCH:1}
        concurrency: 1
        max-concurrency: 1
server.error.include-message: never
management:
  endpoints.web.exposure.include: health,prometheus,circuitbreakers,circuitbreakerevents
  endpoint.health.show-details: never
  metrics:
    tags:
      application: video-workbench
    # 压测要看服务端侧的 p95/p99，而默认的 Timer 只导出 _count/_sum/_max，没有 _bucket，
    # histogram_quantile 会返回空。自定义指标在代码里用 publishPercentileHistogram() 打开。
    distribution:
      percentiles-histogram:
        http.server.requests: true
# 下游容错：并发隔板（本地快速拒绝）+ 熔断器（下游持续失败时不再真的发请求）。
# 重试与超时不在这里配：重试归模型降级链与队列退避，超时归 HTTP 客户端的每请求 timeout，理由见 DownstreamResilience。
resilience4j:
  circuitbreaker:
    instances:
      llm:
        sliding-window-type: COUNT_BASED
        # 窗口与阈值按「一次请求」计数（不是按单个模型算）：一次 requestJson 里主模型失败还会再试备用模型，
        # 只有整次请求都失败才记为一次失败。长视频一次尝试会切多个分块，同一次内容生成就能打出多次请求。
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 不注册健康指示器：熔断打开是下游暂时不可用，不该让本进程的 /actuator/health 变成 DOWN 而被重启。
        register-health-indicator: false
      whisper:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false
  bulkhead:
    instances:
      llm:
        max-concurrent-calls: ${WORKBENCH_LLM_MAX_CONCURRENT:4}
        max-wait-duration: 0
      whisper:
        max-concurrent-calls: ${WORKBENCH_WHISPER_MAX_CONCURRENT:1}
        max-wait-duration: 0
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n'
workbench:
  storage-dir: ${WORKBENCH_STORAGE_DIR:./storage}
  max-upload-bytes: ${WORKBENCH_MAX_UPLOAD_BYTES:21474836480}
  process-timeout-minutes: ${WORKBENCH_PROCESS_TIMEOUT_MINUTES:30}
  queue:
    task-queue: ${WORKBENCH_TASK_QUEUE:workbench.tasks}
    dead-letter-queue: ${WORKBENCH_TASK_DLQ:workbench.tasks.dead}
    max-attempts: ${WORKBENCH_QUEUE_MAX_ATTEMPTS:4}
    retry-initial-delay-millis: ${WORKBENCH_QUEUE_RETRY_INITIAL_DELAY_MILLIS:5000}
    retry-multiplier: ${WORKBENCH_QUEUE_RETRY_MULTIPLIER:2}
  # 多实例认领：任务由「租约持有」而不是「状态即锁」保护，见 TaskLease。
  # instance-id 留空时用「主机名 + 随机后缀」，因此同一台机器上跑多个实例也能区分持有者；
  # 生产建议显式配成稳定且唯一的值（如 workbench-a），日志与库里的归属更好读。
  lease:
    instance-id: ${WORKBENCH_INSTANCE_ID:}
    # 租约时长要显著大于心跳间隔：心跳漏一拍不算失联，连续漏掉数拍才允许别人回收。
    duration-seconds: ${WORKBENCH_LEASE_SECONDS:90}
    heartbeat-interval-millis: ${WORKBENCH_LEASE_HEARTBEAT_MILLIS:20000}
    sweep-interval-millis: ${WORKBENCH_LEASE_SWEEP_MILLIS:30000}
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  security:
    jwt-secret: ${WORKBENCH_JWT_SECRET:}
    token-ttl-hours: ${WORKBENCH_TOKEN_TTL_HOURS:24}
  whisper-service-url: ${WHISPER_SERVICE_URL:http://127.0.0.1:8090}
  whisper-service-token: ${WHISPER_SERVICE_TOKEN:}
  whisper-model: ${WHISPER_MODEL:turbo}
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-v4-flash}
    fallback-model: ${LLM_FALLBACK_MODEL:deepseek-v4-pro}
    reasoning-effort: ${LLM_REASONING_EFFORT:low}
    max-input-chars: ${LLM_MAX_INPUT_CHARS:60000}
    # 单次请求的硬超时，由 HTTP 客户端强制（不是 Resilience4j TimeLimiter，理由见 DownstreamResilience）：
    # 摘要/合并与翻译的输出长度差一个数量级，所以分开配置。
    timeout-seconds: ${WORKBENCH_LLM_TIMEOUT_SECONDS:90}
    translate-timeout-seconds: ${WORKBENCH_LLM_TRANSLATE_TIMEOUT_SECONDS:180}
    # 模型单价（每百万 token），只用于把已入库的 usage 折算成金额：
    # 格式「模型:输入单价:输出单价」，多条用逗号分隔，不配置则只统计 token 不折算金额。
    prices: ${LLM_PRICES:}
    price-currency: ${LLM_PRICE_CURRENCY:USD}
